<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おすすめのグミ診断</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 開始画面 -->
    <div id="start">
      <h1>おすすめグミ診断</h1>
      <p>YES / NO で2問こたえるだけ!</p>
      <button id="start-btn" class="btn">診断をはじめる</button>
    </div>

    <!-- 質問画面 -->
    <div id="question">
      <p id="step">質問　1/2</p>
      <h2 id="question-text"></h2>
      <button id="yes-btn" class="btn yes">YES</button>
      <button id="no-btn" class="btn no">NO</button>
      <p><button id="back-btn">もどる</button></p>
    </div>

    <!-- 結果画面 -->
    <div id="result">
      <p>あなたにおすすめのグミは...</p>
      <h2 id="result-name"></h2>
      <p id="result-maker"></p>
      <p id="result-hard"></p>
      <p id="result-sour"></p>
      <p id="result-text"></p>
      <button id="retry-btn" class="btn">もう一度診断する</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
